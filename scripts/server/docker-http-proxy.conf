# /etc/systemd/system/docker.service.d/http-proxy.conf
# The Docker daemon is a systemd service: it does not use the shell's or dnf's proxy (RCA-3).
# Apply with: systemctl daemon-reload && systemctl restart docker
[Service]
Environment="HTTP_PROXY=http://10.10.10.1:3128"
Environment="HTTPS_PROXY=http://10.10.10.1:3128"
Environment="NO_PROXY=localhost,127.0.0.1,.lab.internal,10.10.10.0/24"
